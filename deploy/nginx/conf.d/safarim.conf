# UzSafar — Nginx reverse proxy.
# ⚠️ "uzsafar.uz" ni o'z domeningizga almashtiring (2 ta server blokda).

upstream safarim_api {
    server api:8000;
}
upstream safarim_frontend {
    server frontend:3000;
}
upstream safarim_minio {
    server minio:9000;
}

# ── HTTP → HTTPS (va ACME challenge) ─────────────────────────────────────────
server {
    listen 80;
    server_name uzsafar.uz www.uzsafar.uz;

    # Let's Encrypt tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name uzsafar.uz www.uzsafar.uz;

    ssl_certificate     /etc/letsencrypt/live/uzsafar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzsafar.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fayl yuklash (guvohnoma rasmlari) uchun limit
    client_max_body_size 15m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Backend API (+ WebSocket chat) ──
    # ── Chat WebSocket ──
    # Brauzer WebSocket'ga sarlavha qo'sha olmaydi, shuning uchun token URL da
    # ketadi (?token=...). Bu manzillar access_log'ga yozilsa, tokenlar log
    # faylida ochiq qolardi — shuning uchun shu yo'lda log o'chirilgan.
    location /api/v1/messages/ws/ {
        access_log off;
        proxy_pass http://safarim_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://safarim_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Mijoz yozgan X-Forwarded-For ni SAQLAMAYMIZ, almashtiramiz: aks holda
        # soxta sarlavha bilan rate-limitdan (ro'yxat/login/OTP) o'tib ketiladi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Frontend (Next.js) ──
    location / {
        proxy_pass http://safarim_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Mijoz yozgan X-Forwarded-For ni SAQLAMAYMIZ, almashtiramiz: aks holda
        # soxta sarlavha bilan rate-limitdan (ro'yxat/login/OTP) o'tib ketiladi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── CDN (MinIO media: avatar, guvohnoma rasmlari) ────────────────────────────
# HTTP → HTTPS (+ ACME)
server {
    listen 80;
    server_name cdn.uzsafar.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTPS → MinIO (S3). Presigned URL host'i (cdn.uzsafar.uz) o'zgarmasligi shart —
# imzo shu Host bilan hisoblangan, shuning uchun Host $host o'tkaziladi (minio:9000 EMAS).
server {
    listen 443 ssl;
    http2 on;
    server_name cdn.uzsafar.uz;

    # Bitta sertifikat barcha subdomenlarni qamraydi (SAN: uzsafar.uz, www, cdn)
    ssl_certificate     /etc/letsencrypt/live/uzsafar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzsafar.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 15m;

    # Media faylni brauzer O'ZI o'ylab boshqa turga aylantirmasin: yuklangan
    # rasm ichida HTML bo'lsa ham, u sahifa sifatida ochilmaydi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;

    location / {
        proxy_pass http://safarim_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Mijoz yozgan X-Forwarded-For ni SAQLAMAYMIZ, almashtiramiz: aks holda
        # soxta sarlavha bilan rate-limitdan (ro'yxat/login/OTP) o'tib ketiladi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
